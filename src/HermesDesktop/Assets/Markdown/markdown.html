<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: https:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"/>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
        font-size: 14px;
        line-height: 1.6;
        padding: 16px;
        color: var(--text-color, #333);
        background: var(--bg-color, #FAFAFA);
    }
    body.dark { --text-color: #CCC; --bg-color: #1E1E1E; --code-bg: #2D2D2D; --border: #3C3C3C; --link: #4FC3F7; }
    body.light { --text-color: #333; --bg-color: #FAFAFA; --code-bg: #F5F5F5; --border: #E0E0E0; --link: #1565C0; }
    h1, h2, h3, h4, h5, h6 { margin: 1em 0 0.5em; font-weight: 600; }
    h1 { font-size: 1.8em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
    h2 { font-size: 1.4em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
    h3 { font-size: 1.2em; }
    p { margin: 0.5em 0; }
    code { font-family: Consolas, 'Cascadia Code', monospace; background: var(--code-bg); padding: 2px 6px; border-radius: 3px; font-size: 0.9em; }
    pre { background: var(--code-bg); padding: 12px; border-radius: 6px; overflow-x: auto; margin: 0.5em 0; }
    pre code { background: none; padding: 0; }
    ul, ol { margin: 0.5em 0 0.5em 1.5em; }
    li { margin: 0.2em 0; }
    a { color: var(--link); text-decoration: none; }
    blockquote { border-left: 3px solid var(--border); padding-left: 12px; margin: 0.5em 0; color: #888; }
    hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
    table { border-collapse: collapse; margin: 0.5em 0; width: 100%; }
    th, td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
    th { background: var(--code-bg); font-weight: 600; }
    strong { font-weight: 600; }
    em { font-style: italic; }
</style>
</head>
<body class="light">
<div id="content"></div>
<script src="marked.min.js"></script>
<script>
    var allowedTags = new Set([
        'A', 'B', 'BLOCKQUOTE', 'BR', 'CODE', 'DEL', 'DIV', 'EM', 'H1', 'H2', 'H3',
        'H4', 'H5', 'H6', 'HR', 'I', 'IMG', 'LI', 'OL', 'P', 'PRE', 'S', 'SPAN',
        'STRONG', 'TABLE', 'TBODY', 'TD', 'TH', 'THEAD', 'TR', 'UL'
    ]);
    var allowedAttrs = new Set(['href', 'src', 'alt', 'title', 'class']);

    function decodeBase64Utf8(base64Content) {
        var binary = atob(base64Content);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
    }

    function isSafeUrl(value) {
        try {
            var url = new URL(value, 'https://hermes.markdown/');
            return url.protocol === 'https:' || url.protocol === 'http:' || url.protocol === 'mailto:';
        } catch (_) {
            return false;
        }
    }

    function sanitizeHtml(html) {
        var template = document.createElement('template');
        template.innerHTML = html;
        var walker = document.createTreeWalker(template.content, NodeFilter.SHOW_ELEMENT);
        var nodesToRemove = [];

        while (walker.nextNode()) {
            var node = walker.currentNode;
            if (!allowedTags.has(node.tagName)) {
                nodesToRemove.push(node);
                continue;
            }

            for (var i = node.attributes.length - 1; i >= 0; i--) {
                var attr = node.attributes[i];
                var name = attr.name.toLowerCase();
                if (name.startsWith('on') || !allowedAttrs.has(name)) {
                    node.removeAttribute(attr.name);
                    continue;
                }
                if ((name === 'href' || name === 'src') && !isSafeUrl(attr.value)) {
                    node.removeAttribute(attr.name);
                }
            }

            if (node.tagName === 'A') {
                node.setAttribute('rel', 'noopener noreferrer');
                node.setAttribute('target', '_blank');
            }
        }

        for (var j = 0; j < nodesToRemove.length; j++) {
            nodesToRemove[j].replaceWith(document.createTextNode(nodesToRemove[j].textContent || ''));
        }

        return template.innerHTML;
    }

    function renderMarkdown(base64Content, isDark) {
        document.body.className = isDark ? 'dark' : 'light';
        try {
            var text = decodeBase64Utf8(base64Content);
            var html = marked.parse(text, { gfm: true, breaks: false });
            document.getElementById('content').innerHTML = sanitizeHtml(html);
        } catch(e) {
            document.getElementById('content').innerText = 'Error rendering markdown: ' + e.message;
        }
    }
</script>
</body>
</html>
