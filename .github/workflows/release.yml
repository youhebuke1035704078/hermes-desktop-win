name: Build & Release

on:
  push:
    branches:
      - master

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: |
          dotnet restore HermesDesktop.sln
          dotnet restore tests/HermesDesktop.Tests/HermesDesktop.Tests.csproj

      - name: Test
        run: dotnet test tests/HermesDesktop.Tests/HermesDesktop.Tests.csproj -c Release --no-restore

      - name: Generate version tag
        id: version
        run: |
          $date = Get-Date -Format "yyyy.MM.dd"
          $count = git tag -l "$date.*" | Measure-Object | Select-Object -ExpandProperty Count
          $version = "$date.$($count + 1)"
          echo "tag=v$version" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "Version: v$version"

      - name: Publish self-contained exe
        # Passing -p:Version stamps AssemblyVersion, FileVersion and
        # InformationalVersion onto the built exe. The in-app updater reads
        # InformationalVersion at runtime and compares it against the latest
        # GitHub Release tag to decide whether a newer build is available.
        run: |
          dotnet publish src/HermesDesktop/HermesDesktop.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.version }} `
            -p:FileVersion=${{ steps.version.outputs.version }} `
            -p:InformationalVersion=${{ steps.version.outputs.version }} `
            -o ./publish

      - name: Generate checksums and zip
        run: |
          $exe = "publish/HermesDesktop.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  HermesDesktop.exe" | Out-File -Encoding ascii "publish/HermesDesktop.exe.sha256"
          Compress-Archive -Path $exe, "publish/HermesDesktop.exe.sha256" -DestinationPath "publish/HermesDesktop-${{ steps.version.outputs.version }}-win-x64.zip" -Force

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            publish/HermesDesktop.exe
            publish/HermesDesktop.exe.sha256
            publish/HermesDesktop-${{ steps.version.outputs.version }}-win-x64.zip
          generate_release_notes: true
