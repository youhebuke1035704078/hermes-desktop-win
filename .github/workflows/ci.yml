name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore HermesDesktop.sln

      - name: Build
        run: dotnet build HermesDesktop.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/HermesDesktop.Tests/HermesDesktop.Tests.csproj -c Release --no-build
